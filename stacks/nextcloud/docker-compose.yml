# from the docker page: https://hub.docker.com/_/nextcloud/
volumes:
  db:

services:
  db:
    image: mariadb:10.6
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  app:
    # pinned: nextcloud only upgrades one major at a time (33 -> 34 -> 35). Bump one major per deploy.
    image: nextcloud:34
    restart: always
    ports:
      - 8204:80
    links:
      - db
    group_add:
      - "${MEDIA_GID:?set MEDIA_GID}"   # lets www-data write the setgid media folders
    volumes:
      - ${DATA_PATH}nextcloud_data:/var/www/html
      # shared media library: add /media in Nextcloud as External Storage (local). Only writer.
      - ${MEDIA_PATH}:/media
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - NEXTCLOUD_TRUSTED_DOMAINS=* #still is not working, have to manually set in the config.php
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/status.php | grep -q installed || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://${LOGSTASH_HOST}:${LOGSTASH_PORT}"
        tag: "nextcloud"
