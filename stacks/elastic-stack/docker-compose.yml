version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - node.name=elasticsearch
      - cluster.name=elk-docker
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 20s
      retries: 10

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    restart: unless-stopped
    environment:
      - "LS_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.monitoring.enabled=false
    volumes:
      - ${PATH}logstash-pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "8007:5044"     # Filebeat input
      - "8008:5000/udp" # GELF input
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    restart: unless-stopped
    ports:
      - "8009:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${ESO_KEY}
    volumes:
      - kibana_data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8009/api/status | grep -q available"]
      interval: 30s
      retries: 10

  elk-setup:
    image: curlimages/curl:latest
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        echo 'Setting kibana_system password...';
        curl -s -u elastic:${ELASTIC_PASSWORD} \
        -X POST http://elasticsearch:9200/_security/user/kibana_system/_password \
        -H 'Content-Type: application/json' \
        -d '{"password": "${KIBANA_PASSWORD}"}' &&
        echo 'Kibana Password Set';
        echo 'Creating ILM policy...';
        curl -s -u elastic:${ELASTIC_PASSWORD} \
        -X PUT http://elasticsearch:9200/_ilm/policy/7-days-default \
        -H 'Content-Type: application/json' \
        -d '{"policy":{"phases":{"hot":{"min_age":"0ms","actions":{"rollover":{"max_age":"1d"}}},"delete":{"min_age":"7d","actions":{"delete":{}}}}}}' &&
        echo 'ILM policy set';
        echo 'ELK setup complete.'
  
volumes:
  elasticsearch_data:
  kibana_data:
