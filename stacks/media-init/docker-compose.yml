# One-shot host preparation for the shared media library.
# Deploy this stack FIRST (and redeploy after changing MEDIA_* / APPDATA_PATH).
# It creates the folders, sets owner/group/setgid, verifies the result and exits.
# Exit 0 = ready. Exit 1 = look at the container logs in Portainer.
name: media-init
services:
  media-init:
    image: alpine:3.20
    container_name: media-init
    restart: "no"
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - FSETID        # without this the setgid bit (2775) is silently stripped by chmod
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - ${MEDIA_PATH:?set MEDIA_PATH}:/media
      - ${APPDATA_PATH:?set APPDATA_PATH}:/appdata
    environment:
      - MEDIA_UID=${MEDIA_UID:?set MEDIA_UID}
      - MEDIA_GID=${MEDIA_GID:?set MEDIA_GID}
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        U="$$MEDIA_UID"; G="$$MEDIA_GID"
        fail() { echo "PREFLIGHT FAILED: $$*" >&2; exit 1; }
        case "$$U$$G" in *[!0-9]*|"") fail "MEDIA_UID/MEDIA_GID must be numeric";; esac
        [ "$$U" -ne 0 ] || fail "MEDIA_UID must not be 0 (root)"

        # library root itself, so nextcloud can create folders directly in it
        chown "$$U:$$G" /media
        chmod 2775 /media

        # shared library: top-level dirs only (not recursive, nextcloud owns what it uploads)
        for d in movies tv music audiobooks podcasts books; do
          mkdir -p "/media/$$d"
          chown "$$U:$$G" "/media/$$d"
          chmod 2775 "/media/$$d"
        done

        # per-app state for the apps that run as MEDIA_UID (small, so recursive is fine)
        for d in jellyfin/config jellyfin/cache audiobookshelf/config audiobookshelf/metadata; do
          mkdir -p "/appdata/$$d"
        done
        chown -R "$$U:$$G" /appdata/jellyfin /appdata/audiobookshelf

        # verify
        got=$$(stat -c '%u:%g %a' /media)
        [ "$$got" = "$$U:$$G 2775" ] || fail "/media is '$$got', expected '$$U:$$G 2775'"
        for d in movies tv music audiobooks podcasts books; do
          got=$$(stat -c '%u:%g %a' "/media/$$d")
          [ "$$got" = "$$U:$$G 2775" ] || fail "/media/$$d is '$$got', expected '$$U:$$G 2775' (NFS root_squash / read-only mount?)"
        done
        for d in jellyfin/config jellyfin/cache audiobookshelf/config audiobookshelf/metadata; do
          got=$$(stat -c '%u:%g' "/appdata/$$d")
          [ "$$got" = "$$U:$$G" ] || fail "/appdata/$$d is '$$got', expected '$$U:$$G'"
        done
        echo "OK: media library and app data ready for uid:gid $$U:$$G"
