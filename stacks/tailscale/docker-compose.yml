
# help from claude, /dev/net/tun, "net.ipv*.... ctls"

services:
  tailscale:
    image: tailscale/tailscale
    container_name: tailscale-exit
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-exit-node --advertise-routes=192.168.1.0/24
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_DNS_NAMESERVERS=127.0.0.1
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://${LOGSTASH_HOST}:${LOGSTASH_PORT}"
        tag: "tailscale"

volumes:
  tailscale-state:
